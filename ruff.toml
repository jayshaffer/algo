target-version = "py312"
line-length = 140

extend-exclude = [
    "logs",
    "logs_paper",
    "public_dashboard",
    "db",
]

[lint]
select = [
    "E",        # pycodestyle errors
    "F",        # pyflakes
    "I",        # isort
    "W",        # pycodestyle warnings
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PLR0915",  # too-many-statements (function-size guardrail)
]
ignore = [
    "E501",    # line-too-long (large existing backlog; revisit later)
    "SIM105",  # contextlib.suppress is often less readable than try/except/pass
    "SIM108",  # ternary vs if/else is a style preference
]

[lint.pylint]
max-statements = 50

[lint.per-file-ignores]
"tests/**" = ["B011", "F841"]   # allow assert False and unused locals in tests
"trading/**" = ["PLR0915"]      # legacy v1 module (sunset); not worth refactoring

[lint.isort]
known-first-party = ["v2", "trading", "dashboard", "tests"]

[format]
quote-style = "double"
indent-style = "space"
