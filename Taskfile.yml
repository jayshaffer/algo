version: "3"

tasks:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  docker:up:
    desc: Start all services
    cmds:
      - docker compose up -d
    status:
      - docker compose ps --status running --format '{{.Name}}' | grep -q trading

  docker:down:
    desc: Stop all services
    cmds:
      - docker compose down

  docker:build:
    desc: Rebuild Docker images
    cmds:
      - docker compose build

  docker:logs:
    desc: Follow container logs (pass service name as arg)
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  docker:stop:session:
    desc: Stop session services (trading, ollama); leave db + dashboard running
    cmds:
      - docker compose stop trading ollama

  setup:ollama:
    desc: Pull Ollama models (run after first docker:up)
    deps: [docker:up]
    cmds:
      - bash scripts/setup-ollama.sh

  # ---------------------------------------------------------------------------
  # Trading workflows
  # ---------------------------------------------------------------------------
  session:
    desc: Run full consolidated daily session
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.session {{.CLI_ARGS}}

  session:dry-run:
    desc: Dry-run the full daily session
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.session --dry-run {{.CLI_ARGS}}

  trade:
    desc: Run the trader
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.trader {{.CLI_ARGS}}

  trade:dry-run:
    desc: Dry-run the trader
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.trader --dry-run {{.CLI_ARGS}}

  ideation:
    desc: Run Claude strategist ideation
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.ideation_claude {{.CLI_ARGS}}

  pipeline:
    desc: Run news processing pipeline
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.pipeline {{.CLI_ARGS}}

  learn:
    desc: Run learning loop
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.learn {{.CLI_ARGS}}

  backfill:
    desc: Backfill decision outcomes
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.backfill {{.CLI_ARGS}}

  backfill:decision:
    desc: Re-run 7d+30d backfill for a single decision (pass --decision-id <ID> via CLI_ARGS). Audit auto-fix path for MISSING_OUTCOMES findings.
    deps: [docker:up]
    cmds:
      - docker compose exec trading python -m v2.backfill {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # Paper trading
  # ---------------------------------------------------------------------------
  paper:up:
    desc: Start all services including paper trading
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.paper.yml up -d

  paper:down:
    desc: Stop all services including paper trading
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.paper.yml down

  paper:session:
    desc: Run full daily session on paper trading
    deps: [paper:up]
    cmds:
      # P1.11: --force was bypassing session idempotency, duplicating decisions/snapshots/etc on rerun. Pass --force via {{.CLI_ARGS}} when intentional.
      - docker compose -f docker-compose.yml -f docker-compose.paper.yml exec trading-paper python -m v2.session --skip-dashboard {{.CLI_ARGS}}

  paper:session:dry-run:
    desc: Dry-run the full daily session on paper trading
    deps: [paper:up]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.paper.yml exec trading-paper python -m v2.session --dry-run {{.CLI_ARGS}}

  paper:dashboard:
    desc: Open paper trading dashboard (port 3001)
    deps: [paper:up]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.paper.yml logs -f dashboard-paper

  paper:backfill:decision:
    desc: Re-run 7d+30d backfill for a single paper decision (pass --decision-id <ID> via CLI_ARGS).
    deps: [paper:up]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.paper.yml exec trading-paper python -m v2.backfill {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # Dev
  # ---------------------------------------------------------------------------
  test:
    desc: Run tests (in trading container)
    deps: [docker:up]
    cmds:
      - docker compose exec -T trading python -m pytest tests/ {{.CLI_ARGS}}

  test:coverage:
    desc: Run tests with coverage (in trading container)
    deps: [docker:up]
    cmds:
      - docker compose exec -T trading python -m pytest tests/ --cov=trading --cov=dashboard --cov=v2 {{.CLI_ARGS}}

  lint:
    desc: Run ruff lint (host, no docker)
    cmds:
      - ruff check {{.CLI_ARGS}} .

  install-hooks:
    desc: Point git at the tracked .githooks directory
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed. Bypass with 'git commit --no-verify'."

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:migrate:
    desc: Apply pending db/migrations/*.sql files to prod db (tracked via schema_migrations)
    deps: [docker:up]
    cmds:
      - |
        psql_exec() { docker compose exec -T db psql -U algo -d trading "$@"; }
        psql_exec -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());" >/dev/null
        for f in $(ls db/migrations/*.sql | sort); do
          name=$(basename "$f")
          applied=$(psql_exec -tAc "SELECT 1 FROM schema_migrations WHERE filename = '$name'")
          if [ "$applied" = "1" ]; then
            echo "==> skipping $name (already applied)"
            continue
          fi
          echo "==> applying $name"
          { cat "$f"; printf "\nINSERT INTO schema_migrations (filename) VALUES ('%s');\n" "$name"; } \
            | psql_exec -v ON_ERROR_STOP=1 --single-transaction -f -
        done

  # ---------------------------------------------------------------------------
  # Audit (driven by docs/audit-playbook.md + Claude Code /loop)
  # ---------------------------------------------------------------------------
  audit:rehearse:
    desc: Run one Phase A discovery tick with no Jira writes; prints would-be payloads
    cmds:
      - claude "/audit-rehearse"

  audit:loop:start:
    desc: Start the long-lived audit /loop in a detached tmux session named 'audit-loop'
    cmds:
      - |
        if tmux has-session -t audit-loop 2>/dev/null; then
          echo "Session 'audit-loop' already exists. Attach with: task audit:loop:attach"
          exit 1
        fi
        tmux new-session -d -s audit-loop -c "$(pwd)" "claude '/loop 24h /audit-tick'"
        echo "Started. Attach with: task audit:loop:attach"

  audit:loop:attach:
    desc: Attach to the running audit /loop tmux session (detach with Ctrl-b d)
    interactive: true
    cmds:
      - tmux attach -t audit-loop

  audit:loop:stop:
    desc: Kill the audit /loop tmux session
    cmds:
      - tmux kill-session -t audit-loop && echo "Stopped." || echo "No session 'audit-loop' running."

  paper:db:migrate:
    desc: Apply pending db/migrations/*.sql files to paper db (tracked via schema_migrations)
    deps: [paper:up]
    cmds:
      - |
        psql_exec() { docker compose -f docker-compose.yml -f docker-compose.paper.yml exec -T db-paper psql -U algo -d trading "$@"; }
        psql_exec -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());" >/dev/null
        for f in $(ls db/migrations/*.sql | sort); do
          name=$(basename "$f")
          applied=$(psql_exec -tAc "SELECT 1 FROM schema_migrations WHERE filename = '$name'")
          if [ "$applied" = "1" ]; then
            echo "==> skipping $name (already applied)"
            continue
          fi
          echo "==> applying $name"
          { cat "$f"; printf "\nINSERT INTO schema_migrations (filename) VALUES ('%s');\n" "$name"; } \
            | psql_exec -v ON_ERROR_STOP=1 --single-transaction -f -
        done
