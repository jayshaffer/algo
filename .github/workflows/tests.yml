name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Some tests call code that connects to Postgres rather than mocking
      # at the get_cursor boundary; spin up a real DB so they pass.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algo
          POSTGRES_PASSWORD: algo
          POSTGRES_DB: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algo -d trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://algo:algo@localhost:5432/trading
      # Tests mock external services, but some code paths construct real
      # Alpaca/Anthropic clients before patches are applied — the SDKs need
      # *something* in these vars to pass their own credential validation.
      ALPACA_API_KEY: test-key
      ALPACA_SECRET_KEY: test-secret
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_PAPER: "true"
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            v2/requirements.txt
            trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt -r trading/requirements.txt
          pip install ruff

      - name: Apply db migrations
        env:
          PGPASSWORD: algo
        run: |
          for f in db/init/*.sql; do
            echo "applying $f"
            psql -h localhost -U algo -d trading -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest
