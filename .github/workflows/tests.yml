name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests mock external services, but some code paths construct real
      # Alpaca/Anthropic clients before patches are applied — the SDKs need
      # *something* in these vars to pass their own credential validation.
      ALPACA_API_KEY: test-key
      ALPACA_SECRET_KEY: test-secret
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_PAPER: "true"
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            v2/requirements.txt
            trading/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt -r trading/requirements.txt
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest
